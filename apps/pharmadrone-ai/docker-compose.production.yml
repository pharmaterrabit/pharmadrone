services:
  pharmadrone-ai:
    build:
      context: ../..
      dockerfile: apps/pharmadrone-ai/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL DATABASE_URL}
      PHARMADRONE_AI_AUTH_SECRET: ${PHARMADRONE_AI_AUTH_SECRET:?Set a unique secret of at least 32 characters}
      PHARMADRONE_AI_ALLOWED_ORIGINS: ${PHARMADRONE_AI_ALLOWED_ORIGINS:?Set the deployed browser origin}
      PHARMADRONE_AI_API_DOCS: ${PHARMADRONE_AI_API_DOCS:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EPO_OPS_CLIENT_ID: ${EPO_OPS_CLIENT_ID:-}
      EPO_OPS_CLIENT_SECRET: ${EPO_OPS_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
