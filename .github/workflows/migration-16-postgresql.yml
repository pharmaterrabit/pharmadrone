name: Foundation migrations PostgreSQL validation

on:
  pull_request:
    paths:
      - "pharmadrone/storage/migrations/__init__.py"
      - "tests/test_foundation_pr_a.py"
      - "tests/test_foundation_pr_a_postgres.py"
      - "tests/test_foundation_pr_a_rollback.py"
      - "tests/test_foundation_pr_b.py"
      - "tests/test_foundation_pr_b_postgres.py"
      - "tests/test_foundation_pr_c.py"
      - "tests/test_foundation_pr_c_postgres.py"
      - "tests/test_foundation_pr_d.py"
      - "tests/test_foundation_pr_d_postgres.py"
      - "pharmadrone/canonicalisation.py"
      - "pharmadrone/intelligence/**"
      - "pharmatune_admin/app.py"
      - "pharmatune_admin/pages.py"
      - "pharmatune_ui/app.py"
      - "pharmatune_ui/data.py"
      - "pharmatune_ui/pages.py"
      - "pharmatune_ui/canonical_intelligence.py"
      - "tests/test_foundation_pr_e.py"
      - "tests/test_foundation_pr_e_postgres.py"
      - "tests/test_foundation_pr_f.py"
      - "tests/test_foundation_pr_g.py"
      - "tests/test_foundation_pr_g_postgres.py"
      - "tests/test_phase9_patent_foundation.py"
      - "pharmadrone/pipeline/ai_bd_service.py"
      - "pharmadrone_ai/**"
      - "apps/pharmadrone-ai/**"
      - "tests/test_pharmadrone_ai.py"
      - "tests/test_pharmadrone_ai_deployment.py"
      - "tests/test_pharmadrone_ai_postgres.py"
      - ".github/workflows/migration-16-postgresql.yml"

jobs:
  foundation-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmadrone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmadrone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharmadrone_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run focused Foundation migration tests
        shell: bash
        run: |
          set -o pipefail
          output="$(python -m pytest -q tests/test_pharmadrone_ai_postgres.py tests/test_pharmadrone_ai.py tests/test_pharmadrone_ai_deployment.py tests/test_foundation_pr_g_postgres.py tests/test_foundation_pr_g.py tests/test_foundation_pr_f.py tests/test_foundation_pr_e_postgres.py tests/test_foundation_pr_e.py tests/test_foundation_pr_d_postgres.py tests/test_foundation_pr_d.py tests/test_foundation_pr_c_postgres.py tests/test_foundation_pr_c.py tests/test_foundation_pr_b_postgres.py tests/test_foundation_pr_b.py tests/test_foundation_pr_a_postgres.py tests/test_foundation_pr_a.py tests/test_foundation_pr_a_rollback.py tests/test_phase9_patent_foundation.py 2>&1)" || {
              printf '%s\n' "$output"
              exit 1
            }
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eq '[0-9]+ skipped'; then
            echo "Real PostgreSQL Foundation migration validation must not skip."
            exit 1
          fi

      - name: Build standalone PharmaDrone AI production image
        run: >-
          docker build
          --file apps/pharmadrone-ai/Dockerfile
          --tag pharmadrone-ai:ci
          .

      - name: Verify production container startup and health
        shell: bash
        run: |
          docker run --detach \
            --name pharmadrone-ai-production-smoke \
            --network host \
            --env DATABASE_URL="$TEST_DATABASE_URL" \
            --env PHARMADRONE_AI_AUTH_SECRET="ci-production-auth-secret-at-least-32-characters" \
            --env PHARMADRONE_AI_ALLOWED_ORIGINS="http://localhost:8000" \
            pharmadrone-ai:ci
          for attempt in $(seq 1 30); do
            if curl --fail --show-error --silent http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs pharmadrone-ai-production-smoke
          exit 1

      - name: Stop standalone production container
        if: always()
        run: docker rm --force pharmadrone-ai-production-smoke || true
